<!doctype html><html lang="pl"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Oferta – Smart Meble</title>
<link rel="icon" href="assets/img/favicon.ico">
<style>
  :root{ --accent:#b7d331; --ink:#111827; --muted:#6b7280; --line:#e5e7eb; }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',Arial,Helvetica,sans-serif;background:#eef0f2;color:var(--ink)}
  .toolbar{position:sticky;top:0;background:#111827;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;z-index:10}
  .toolbar button{background:var(--accent);color:#0b0f14;border:none;padding:9px 16px;border-radius:10px;font-weight:700;cursor:pointer}
  .toolbar .hint{font-size:12px;color:#cbd5e1}
  .sheet{max-width:820px;margin:28px auto;background:#fff;border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.12);overflow:hidden}
  .offer-header{background:#f3f4f6;border-bottom:1px solid var(--line);color:var(--ink);padding:32px 44px;display:flex;justify-content:space-between;align-items:center}
  .offer-header img{height:54px;display:block;border-radius:8px}
  .offer-title{font-size:32px;font-weight:800;letter-spacing:.04em;color:var(--ink)}
  .offer-sub{color:#6b7280;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-top:6px}
  .offer-meta{text-align:right;font-size:12px;color:var(--muted)}
  .offer-meta b{color:var(--ink);font-size:13px}
  .client-box{margin:30px 44px 10px;padding:18px 22px;background:#f9fafb;border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;font-size:13px}
  .client-box .label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.03em}
  .client-box .value{font-weight:700;font-size:14px}
  .items{margin:26px 44px}
  .item{padding:22px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:24px}
  .item:last-child{border-bottom:none}
  .item-name{font-size:18px;font-weight:800;margin-bottom:8px}
  .item-specs{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:5px}
  .item-specs li{font-size:13px;color:#374151;padding-left:18px;position:relative}
  .item-specs li:before{content:'✓';position:absolute;left:0;color:var(--accent);font-weight:900}
  .item-price{font-size:19px;font-weight:800;white-space:nowrap;color:var(--ink)}
  .totals{margin:0 44px 40px;padding-top:20px;border-top:2px solid var(--ink);display:flex;justify-content:space-between;align-items:center}
  .totals .label{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .totals .value{font-size:30px;font-weight:900;color:var(--ink)}
  .footer-note{margin:0 44px 34px;font-size:11px;color:var(--muted)}
  @media print{
    body{background:#fff}
    .toolbar{display:none}
    .sheet{box-shadow:none;margin:0;border-radius:0;max-width:100%}
  }
</style>
</head>
<body>
<div class="toolbar">
  <div><b>Podgląd oferty</b> <span class="hint">— użyj przycisku, aby zapisać jako PDF</span></div>
  <button onclick="window.print()">Drukuj / Zapisz jako PDF</button>
</div>
<div class="sheet" id="sheet">
  <div style="padding:60px;text-align:center;color:#6b7280">Ładowanie oferty…</div>
</div>

<script src="config.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id');
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
function fmtMoney(v){ const n=Number(v||0); return new Intl.NumberFormat('pl-PL',{style:'currency',currency:'PLN'}).format(n); }
function fmtDate(v){ if(!v) return ''; const d=new Date(v); if(isNaN(d)) return v; return d.toLocaleDateString('pl-PL'); }
function wycenaHeaders(){ return {'Content-Type':'application/json', ...authHeaders(), 'X-Wycena-Token': sessionStorage.getItem('wycena_token')||''}; }
async function wApiGet(path){ const r=await fetch(API_BASE+path,{headers:wycenaHeaders()}); const t=await r.text(); if(!r.ok) throw new Error(t); return JSON.parse(t); }

async function load(){
  try{
    const r = await wApiGet('wycena_api.php?action=get&id='+id);
    render(r.quote);
  }catch(e){
    document.getElementById('sheet').innerHTML = '<div style="padding:60px;text-align:center;color:#b91c1c">Nie udało się wczytać oferty. Wróć do karty wyceny i odblokuj moduł hasłem, jeśli sesja wygasła.</div>';
  }
}
function render(q){
  const clientName = ((q.client_first_name||'')+' '+(q.client_last_name||'')).trim() || '—';
  const address = [q.install_street, q.install_no].filter(Boolean).join(' ') + (q.install_postcode||q.install_city ? (', '+[q.install_postcode,q.install_city].filter(Boolean).join(' ')) : '');
  const itemsHtml = (q.furniture||[]).map(f=>{
    const specs = (f.specs||[]).map(s=>'<li>'+esc(s.text)+'</li>').join('');
    return '<div class="item">'
      + '<div style="flex:1">'
        + '<div class="item-name">'+esc(f.name||'Bez nazwy')+'</div>'
        + (specs ? '<ul class="item-specs">'+specs+'</ul>' : '')
      + '</div>'
      + '<div class="item-price">'+fmtMoney(f.final_price)+'</div>'
    + '</div>';
  }).join('');
  document.getElementById('sheet').innerHTML =
    '<div class="offer-header">'
      + '<div style="display:flex;align-items:center;gap:18px"><img src="https://panel.smartmeble.pl/frontend/assets/img/logo_smartmeble.png"><div><div class="offer-sub">Smart Meble</div><div class="offer-title">OFERTA</div></div></div>'
      + '<div class="offer-meta">Data: <b>'+esc(fmtDate(q.quote_date))+'</b></div>'
    + '</div>'
    + '<div class="client-box">'
      + '<div><div class="label">Klient</div><div class="value">'+esc(clientName)+'</div></div>'
      + '<div><div class="label">Kontakt</div><div class="value">'+esc([q.client_phone,q.client_email].filter(Boolean).join(' • ')||'—')+'</div></div>'
      + (address.trim() ? '<div style="grid-column:1/-1"><div class="label">Adres</div><div class="value">'+esc(address)+'</div></div>' : '')
    + '</div>'
    + '<div class="items">'+(itemsHtml || '<div style="color:#6b7280;padding:20px 0">Brak pozycji w wycenie.</div>')+'</div>'
    + '<div class="totals"><div class="label">Cena całkowita oferty</div><div class="value">'+fmtMoney(q.total_value)+'</div></div>'
    + '<div class="footer-note">Oferta ma charakter informacyjny i jest ważna 14 dni od daty wystawienia. Ceny zawierają materiały, wykonanie oraz montaż. Smart Meble.</div>';
}
document.addEventListener('DOMContentLoaded', load);
</script>
</body></html>

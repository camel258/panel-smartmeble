<!doctype html><html lang="pl"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Smart Meble – Zamówienia zakończone</title>
<link rel="icon" href="assets/img/favicon.ico"><link rel="stylesheet" href="assets/css/theme_v17.css"/>
<style id="finished-mobile-cards">
.ordersWrap{overflow:auto}
.ordersTable{width:100%;table-layout:fixed;border-collapse:collapse}
.ordersTable th,.ordersTable td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ordersTable .cell-ellipsis{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ordersTable .cell-no-ellipsis{display:block;overflow:visible;text-overflow:clip;white-space:nowrap}
.mobile-months{display:none}
.mobile-month-section{margin:10px 0 18px}
.selection-sticky{position:sticky;top:10px;z-index:30;box-shadow:0 8px 20px rgba(15,23,42,.12)}
@media (max-width:768px){.selection-sticky{top:6px}}
.mobile-month-title{font-size:18px;font-weight:700;margin:0 0 10px 0}
.mobile-order-card{background:#232323;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.mobile-order-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.mobile-order-name{font-weight:700;font-size:14px;line-height:1.2}
.mobile-order-scope{font-size:13px;color:#e5e7eb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mobile-order-dates{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.mobile-order-date{font-size:12px;color:#cbd5e1}
.mobile-order-label{display:block;font-size:11px;color:var(--muted)}
@media (max-width:768px){
  .ordersWrap{display:none !important}
  .mobile-months{display:block}
}
</style>
</head>

<body><div class="app"><aside class="sidebar"><div class="brand"><img src="assets/img/logo_smartmeble.png" style="height:28px"/><div>PANEL</div></div><nav><a href="orders.html">Zamówienia aktualne</a><a class="active" href="orders_finished.html">Zamówienia zakończone</a><a data-super-only href="orders_deleted.html">Zamówienia usunięte</a><a data-finance-only href="payments.html">Rozliczenia</a><a data-admin-only href="import_orders.html">Import zamówień</a><a href="schedule.html">Grafik</a><a data-admin-only href="users.html">Użytkownicy</a><a data-admin-only href="statuses.html">Statusy</a><a data-admin-only href="notifications.html">Powiadomienia</a><a data-admin-only href="settings.html">Ustawienia</a></nav></aside>
<div class="content"><div id="appTopbar" data-title="Zamówienia zakończone" data-subtitle="Panel zamówień"></div><main class="main"><div id="err" class="err" style="margin-bottom:10px"></div><div class="card">
<div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center"><input id="q" class="input" placeholder="Szukaj: klient, przedmiot…"><select id="statusFilter" class="input"><option value="">Wszystkie statusy</option></select><input id="year" class="input" style="width:110px" placeholder="Rok"><input id="month" class="input" style="width:110px" placeholder="Miesiąc"><input id="from" class="input" type="date"><input id="to" class="input" type="date"><button class="btn" id="go">Szukaj</button><button class="btn" id="exportBtn">Eksport XLS</button></div>
<div id="bulkBar" class="card selection-sticky" style="display:none;margin-bottom:12px;padding:12px;background:#fff;border:1px solid var(--line)">
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <b id="bulkCount">Zaznaczono: 0</b>
    <span id="bulkSums" style="display:none;color:#475569;font-weight:700"></span>
    <button class="btn" id="bulkRestoreBtn">Przywróć do aktualnych</button><button class="btn" id="bulkDeleteBtn">Przenieś do usuniętych</button>
    <button class="btn" id="bulkClearBtn">Wyczyść zaznaczenie</button>
  </div>
</div>
<div id="wrap"></div></div></main></div></div>
<script src="config.js"></script><script src="assets/js/helpers_ext.js"></script><script src="assets/js/menu.js"></script><script src="assets/js/topbar.js"></script>
<script>
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pill(name,color){ const c=color||'#065f46'; return '<span style="display:inline-block;padding:6px 10px;border-radius:999px;color:#fff;background:'+c+'">'+esc(name||'—')+'</span>'; }
const selectedIds = new Set();
let canManageBulk = false;
let canFinanceVisible = false;
const currentRowsById = new Map();
function updateBulkBar(){
  const n = selectedIds.size;
  const bar = document.getElementById('bulkBar');
  const count = document.getElementById('bulkCount');
  const sumsEl = document.getElementById('bulkSums');
  if(bar) bar.style.display = (canManageBulk && n>0) ? '' : 'none';
  if(count) count.textContent = 'Zaznaczono: ' + n;
  document.querySelectorAll('.order-check').forEach(ch=>{ ch.checked = selectedIds.has(Number(ch.value)); });
  const all = document.querySelectorAll('.order-check').length;
  const checked = document.querySelectorAll('.order-check:checked').length;
  document.querySelectorAll('.check-all-month').forEach(ch=>{
    const group = ch.dataset.group || '';
    const items = Array.from(document.querySelectorAll('.order-check[data-group="'+group+'"]'));
    const total = items.length;
    const checkedInGroup = items.filter(i=>i.checked).length;
    ch.checked = total>0 && checkedInGroup===total;
    ch.indeterminate = checkedInGroup>0 && checkedInGroup<total;
  });
  if(!sumsEl) return;
  if(!canFinanceVisible || n<=0){ sumsEl.style.display='none'; sumsEl.textContent=''; return; }
  let total=0, paid=0, remaining=0;
  selectedIds.forEach(id=>{
    const row = currentRowsById.get(Number(id));
    if(!row) return;
    total += Number(row.total_with_addons ?? row.total_amount ?? 0);
    paid += Number(row.paid_sum ?? 0);
    remaining += Number(row.remaining ?? 0);
  });
  const txt = 'Suma zaznaczonych → Wartość: ' + fmtMoney(total) + ' | Wpłacono: ' + fmtMoney(paid) + ' | Pozostało: ' + fmtMoney(remaining);
  if(sumsEl){ sumsEl.style.display=''; sumsEl.textContent = txt; }
}
async function detectCaps(){
  try{
    const r = await apiGet('session_check.php');
    const caps = r.caps || {};
    canManageBulk = !!(caps.is_admin || caps.is_superadmin);
  }catch(e){ canManageBulk = false; }
}

function shortText(s, n=26){ s=String(s||''); return s.length>n ? s.slice(0,n-1)+'…' : s; }
function renderFinishedMobile(groups, canFinance){
  wrap.innerHTML = '<div class="mobile-months"></div>';
  const root = wrap.querySelector('.mobile-months');
  groups.forEach(g=>{
    const sec = document.createElement('section');
    sec.className = 'mobile-month-section';
    sec.innerHTML = '<div class="mobile-month-title">'+esc(g.title)+'</div>';
    (g.items||[]).forEach(r=>{
      const card = document.createElement('div');
      card.className = 'mobile-order-card';
      card.style.cursor = 'pointer';
      card.onclick = ()=>location.href='order_details.html?id='+r.id;
      const full=((r.client_first_name||'')+' '+(r.client_last_name||'')).trim();
      card.innerHTML =
        '<div class="mobile-order-top">'+pill(r.status_name||'',r.status_color||'')+'</div>'
        + '<div class="mobile-order-name">'+esc(shortText(full, 18))+'</div>'
        + '<div class="mobile-order-scope" title="'+esc(r.item_description||'')+'">'+esc(shortText(r.item_description||'', 28))+'</div>'
        + '<div class="mobile-order-dates">'
          + '<div class="mobile-order-date"><span class="mobile-order-label">Data montażu</span>'+esc(r.install_date||'')+'</div>'
          + '<div class="mobile-order-date"><span class="mobile-order-label">Nowa data</span>'+esc(r.install_date_new||'')+'</div>'
          + '<div class="mobile-order-date"><span class="mobile-order-label">Data umowy</span>'+esc(r.contract_date||'')+'</div>'
          + (canFinance ? '<div class="mobile-order-date"><span class="mobile-order-label">Pozostało</span>'+esc(fmtMoney(r.remaining ?? 0))+'</div>' : '')
        + '</div>';
      sec.appendChild(card);
    });
    root.appendChild(sec);
  });
}
function bindCheckboxes(){

  document.querySelectorAll('.order-check').forEach(ch=>{
    ch.addEventListener('click', e=>e.stopPropagation());
    ch.addEventListener('change', ()=>{
      const id = Number(ch.value);
      if(ch.checked) selectedIds.add(id); else selectedIds.delete(id);
      updateBulkBar();
    });
  });
  document.querySelectorAll('.check-all-month').forEach(ch=>{
    ch.addEventListener('change', ()=>{
      const group = ch.dataset.group || '';
      document.querySelectorAll('.order-check[data-group="'+group+'"]').forEach(item=>{
        const id = Number(item.value);
        if(ch.checked){ selectedIds.add(id); item.checked=true; } else { selectedIds.delete(id); item.checked=false; }
      });
      updateBulkBar();
    });
  });
  updateBulkBar();
}
async function bulkAction(payload, successMsg){
  if(!selectedIds.size) return;
  try{
    await apiPost('orders_bulk.php', Object.assign({}, payload, { ids:[...selectedIds] }));
    selectedIds.clear();
    err.textContent = successMsg || 'Operacja wykonana ✅';
    await load();
  }catch(e){
    console.error(e);
    err.textContent = 'Nie udało się wykonać operacji zbiorczej.';
  }
}
async function loadStatuses(){ statusFilter.innerHTML='<option value="">Wszystkie statusy</option>'; try{ const r=await apiGet('statuses.php'); (r.items||[]).forEach(s=>{ const o=document.createElement('option'); o.value=s.id; o.textContent=s.name; statusFilter.appendChild(o);}); }catch(e){} }
function buildQs(){ const qs=new URLSearchParams(); if(q.value.trim()) qs.set('q',q.value.trim()); if(statusFilter.value) qs.set('status',statusFilter.value); if(year.value.trim()) qs.set('year',year.value.trim()); if(month.value.trim()) qs.set('month',month.value.trim()); if(from.value) qs.set('from',from.value); if(to.value) qs.set('to',to.value); return qs; }

async function load(){
  try{
    err.textContent='';
    const res=await apiGet('orders_finished.php?'+buildQs().toString());
    const canFinance=!!res.can_view_finance;
    canFinanceVisible = canFinance;
    currentRowsById.clear();
    (res.items||[]).forEach(r=>currentRowsById.set(Number(r.id), r));
    const groups=groupOrders(res.items||[]);
    wrap.innerHTML='';

    if(window.innerWidth <= 768){
      renderFinishedMobile(groups, canFinance);
      return;
    }

    groups.forEach(g=>{
      const sec=document.createElement('section');
      const groupKey = String(g.title || '').replace(/[^a-zA-Z0-9_-]+/g,'_');
      const heads=(canManageBulk?'<th style="width:36px"><input type="checkbox" class="check-all-month" data-group="'+groupKey+'"></th>':'') + (canFinance?'<th>Status</th><th>Klient</th><th>Przedmiot</th><th>Utworzono</th><th>Data umowy</th><th>Data montażu</th><th>Nowa data</th><th>Wartość</th><th>Wpłacona</th><th>Pozostało</th><th>Rozpiska</th><th>Monterzy</th>':'<th>Status</th><th>Klient</th><th>Przedmiot</th><th>Utworzono</th><th>Data umowy</th><th>Data montażu</th><th>Nowa data</th><th>Rozpiska</th><th>Monterzy</th>');
      const colgroup = canManageBulk
        ? (canFinance
            ? '<colgroup><col style="width:3%"><col style="width:10%"><col style="width:13%"><col style="width:18%"><col style="width:8%"><col style="width:8%"><col style="width:8%"><col style="width:8%"><col style="width:6%"><col style="width:6%"><col style="width:6%"><col style="width:8%"><col style="width:8%"></colgroup>'
            : '<colgroup><col style="width:3%"><col style="width:12%"><col style="width:17%"><col style="width:24%"><col style="width:9%"><col style="width:9%"><col style="width:9%"><col style="width:9%"><col style="width:8%"></colgroup>')
        : (canFinance
            ? '<colgroup><col style="width:10%"><col style="width:13%"><col style="width:18%"><col style="width:8%"><col style="width:8%"><col style="width:8%"><col style="width:8%"><col style="width:6%"><col style="width:6%"><col style="width:6%"><col style="width:8%"><col style="width:8%"></colgroup>'
            : '<colgroup><col style="width:12%"><col style="width:17%"><col style="width:24%"><col style="width:9%"><col style="width:9%"><col style="width:9%"><col style="width:9%"><col style="width:8%"></colgroup>');
      sec.innerHTML='<h3 style="margin:12px 6px">'+esc(g.title)+'</h3><div class="ordersWrap"><table class="table ordersTable">'+colgroup+'<thead><tr>'+heads+'</tr></thead><tbody></tbody></table></div>';
      const tb=sec.querySelector('tbody');
      (g.items||[]).forEach(r=>{
        const tr=document.createElement('tr');
        tr.className='tr';
        tr.style.cursor='pointer';
        tr.onclick=(ev)=>{ if(ev.target.closest('input,button,label,select')) return; location.href='order_details.html?id='+r.id; };
        let html=''; const clientName=((r.client_first_name||'')+' '+(r.client_last_name||'')).trim();
        if(canManageBulk){ html+='<td><input type="checkbox" class="order-check" data-group="'+groupKey+'" value="'+r.id+'"></td>'; }
        html+='<td title="'+esc(r.status_name||'')+'">'+pill(r.status_name||'',r.status_color||'')+'</td><td title="'+esc(clientName)+'"><span class="cell-ellipsis">'+esc(clientName)+'</span></td><td title="'+esc(r.item_description||'')+'"><span class="cell-ellipsis">'+esc(r.item_description||'')+'</span></td><td title="'+esc(r.created_at||'')+'"><span class="cell-ellipsis">'+esc(r.created_at||'')+'</span></td><td title="'+esc(r.contract_date||'')+'"><span class="cell-ellipsis">'+esc(r.contract_date||'')+'</span></td><td title="'+esc(r.install_date||'')+'"><span class="cell-ellipsis">'+esc(r.install_date||'')+'</span></td><td title="'+esc(r.install_date_new||'')+'"><span class="cell-ellipsis">'+esc(r.install_date_new||'')+'</span></td>';
        if(canFinance){ html+='<td title="'+esc(fmtMoney(r.total_with_addons ?? r.total_amount))+'"><span class="cell-ellipsis">'+fmtMoney(r.total_with_addons ?? r.total_amount)+'</span></td><td title="'+esc(fmtMoney(r.paid_sum ?? 0))+'"><span class="cell-ellipsis">'+fmtMoney(r.paid_sum ?? 0)+'</span></td><td title="'+esc(fmtMoney(r.remaining ?? 0))+'"><span class="cell-ellipsis">'+fmtMoney(r.remaining ?? 0)+'</span></td>'; }
        html+='<td title="'+esc(r.scheduler_name||'')+'"><span class="cell-no-ellipsis">'+esc(r.scheduler_name||'')+'</span></td><td title="'+esc((r.mounters||[]).join(', '))+'"><span class="cell-no-ellipsis">'+esc((r.mounters||[]).join(', '))+'</span></td>';
        tr.innerHTML=html; tb.appendChild(tr);
      });
      wrap.appendChild(sec);
    });
    bindCheckboxes();
  }catch(e){
    err.textContent='Błąd połączenia z serwerem (finished).';
  }
}
;
bulkRestoreBtn.onclick = async ()=>{
  if(!selectedIds.size) return;
  if(!confirm('Przywrócić zaznaczone zamówienia do aktualnych?')) return;
  try{
    await apiPost('order_restore.php', {ids:[...selectedIds]});
    selectedIds.clear();
    err.textContent = 'Przywrócono zamówienia do aktualnych ✅';
    await load();
  }catch(e){
    console.error(e);
    err.textContent = 'Nie udało się przywrócić zamówień.';
  }
};
bulkClearBtn.onclick = ()=>{ selectedIds.clear(); updateBulkBar(); };
exportBtn.onclick=()=>{ location.href = API_BASE + 'orders_export.php?state=finished&' + buildQs().toString(); };
go.onclick=load;
window.addEventListener('resize', load);
document.addEventListener('DOMContentLoaded', async()=>{ await detectCaps(); await loadStatuses(); await load(); });
</script></body></html>

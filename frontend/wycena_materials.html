<!doctype html><html lang="pl"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Baza materiałów – Wycena</title>
<link rel="icon" href="assets/img/favicon.ico">
<link rel="stylesheet" href="assets/css/theme_v17.css"/>
<style>
.mtable{width:100%;border-collapse:collapse;font-size:13px}
.mtable th,.mtable td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left}
.mtable input{width:100%;box-sizing:border-box;padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text)}
.mtable input[type=number]{max-width:110px}
.inactive-row{opacity:.5}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><img src="assets/img/logo_smartmeble.png" style="height:28px"/></div>
    <nav></nav>
  </aside>
  <div class="content">
    <div class="topbar">
      <div><b>Baza materiałów</b> <span style="color:var(--muted);font-size:13px">— ceny bazowe dla modułu Wycena</span></div>
      <div style="display:flex;gap:10px">
        <button class="btn" id="backBtn" style="background:#555;color:#fff">← Wycena</button>
        <button class="btn" id="logoutBtn">Wyloguj</button>
      </div>
    </div>
    <main class="main">
      <div class="card">
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-end">
          <div><label>Nazwa materiału</label><input class="input" id="newName" placeholder="np. Płyta meblowa 18mm"></div>
          <div><label>Jednostka</label>
            <select class="input" id="newUnit"><option value="m2">m²</option><option value="mb">mb</option><option value="szt">szt.</option><option value="kpl">kpl.</option></select>
          </div>
          <div><label>Cena jednostkowa (zł)</label><input class="input" id="newPrice" type="number" step="0.01" style="max-width:130px"></div>
          <button class="btn" id="addBtn">Dodaj materiał</button>
        </div>
        <table class="mtable">
          <thead><tr><th>Nazwa</th><th>Jednostka</th><th>Cena jednostkowa</th><th>Aktywny</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div id="empty" style="display:none;color:var(--muted);padding:14px">Brak materiałów w bazie.</div>
      </div>
    </main>
  </div>
</div>

<script src="config.js"></script><script src="assets/js/menu.js"></script>
<script>
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
function wycenaHeaders(){ return {'Content-Type':'application/json', ...authHeaders(), 'X-Wycena-Token': sessionStorage.getItem('wycena_token')||''}; }
async function wApiGet(path){ const r=await fetch(API_BASE+path,{headers:wycenaHeaders()}); const t=await r.text(); if(!r.ok) throw new Error(t); return JSON.parse(t); }
async function wApiPost(path, body){ const r=await fetch(API_BASE+path,{method:'POST',headers:wycenaHeaders(),body:JSON.stringify(body||{})}); const t=await r.text(); if(!r.ok) throw new Error(t); return JSON.parse(t); }

async function checkRole(){
  try{
    const r = await apiGet('session_check.php');
    const role = Number(r?.user?.role_id ?? r?.user?.role ?? 0);
    if(role !== 999){ location.href='orders.html'; return false; }
    return true;
  }catch(e){ location.href='login.html'; return false; }
}

async function loadMaterials(){
  try{
    const r = await wApiGet('wycena_materials.php');
    const items = r.items || [];
    const tbody = document.getElementById('rows');
    tbody.innerHTML = '';
    document.getElementById('empty').style.display = items.length ? 'none' : '';
    items.forEach(it=>{
      const tr = document.createElement('tr');
      tr.className = Number(it.is_active) ? '' : 'inactive-row';
      tr.innerHTML =
        '<td><input value="'+esc(it.name)+'" data-field="name" data-id="'+it.id+'"></td>'
        + '<td><select data-field="unit" data-id="'+it.id+'">'+['m2','mb','szt','kpl'].map(u=>'<option value="'+u+'"'+(u===it.unit?' selected':'')+'>'+(u==='m2'?'m²':u)+'</option>').join('')+'</select></td>'
        + '<td><input type="number" step="0.01" value="'+Number(it.unit_price)+'" data-field="unit_price" data-id="'+it.id+'"></td>'
        + '<td><input type="checkbox" data-field="is_active" data-id="'+it.id+'" '+(Number(it.is_active)?'checked':'')+'></td>'
        + '<td><button class="btn" data-del="'+it.id+'" style="background:#b91c1c;color:#fff">Usuń</button></td>';
      tbody.appendChild(tr);
    });
    tbody.querySelectorAll('input,select').forEach(el=>{
      el.onchange = ()=>saveRow(Number(el.dataset.id));
    });
    tbody.querySelectorAll('[data-del]').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!confirm('Usunąć materiał z bazy?')) return;
        try{ await wApiPost('wycena_materials.php', {action:'delete', id:Number(btn.dataset.del)}); await loadMaterials(); }
        catch(e){ alert('Błąd usuwania.'); }
      };
    });
  }catch(e){
    document.getElementById('rows').innerHTML = '<tr><td colspan="5">Błąd wczytywania (wróć do Wyceny, aby się odblokować).</td></tr>';
  }
}
async function saveRow(id){
  const tr = document.querySelector('[data-id="'+id+'"]').closest('tr');
  const name = tr.querySelector('[data-field="name"]').value.trim();
  const unit = tr.querySelector('[data-field="unit"]').value;
  const unit_price = Number(tr.querySelector('[data-field="unit_price"]').value||0);
  const is_active = tr.querySelector('[data-field="is_active"]').checked ? 1 : 0;
  try{ await wApiPost('wycena_materials.php', {action:'update', id, name, unit, unit_price, is_active}); }
  catch(e){ alert('Błąd zapisu wiersza.'); }
}
document.getElementById('addBtn').onclick = async ()=>{
  const name = document.getElementById('newName').value.trim();
  const unit = document.getElementById('newUnit').value;
  const unit_price = Number(document.getElementById('newPrice').value||0);
  if(!name){ alert('Podaj nazwę materiału.'); return; }
  try{
    await wApiPost('wycena_materials.php', {action:'add', name, unit, unit_price});
    document.getElementById('newName').value=''; document.getElementById('newPrice').value='';
    await loadMaterials();
  }catch(e){ alert('Błąd dodawania materiału.'); }
};
document.getElementById('backBtn').onclick = ()=>location.href='wycena.html';
document.getElementById('logoutBtn').onclick = ()=>{ localStorage.removeItem('token'); location.href='login.html'; };

document.addEventListener('DOMContentLoaded', async ()=>{
  const ok = await checkRole();
  if(!ok) return;
  if(!sessionStorage.getItem('wycena_token')){ location.href='wycena.html'; return; }
  loadMaterials();
});
</script>
</body></html>
